<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0F1517"/>
  <g transform="translate(4 4) scale(2.333)">
  <defs>
    <clipPath id="hc-top"><circle cx="12" cy="8.1" r="3.1"/></clipPath>
