  <g fill="#514a43" fill-opacity=".58" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="450" y="930" font-size="22" letter-spacing="4">PRODUCT-OWNED TEXTILE</text>
    <text x="450" y="965" font-size="18" letter-spacing="2">COTTON KNIT / NEUTRAL</text>
