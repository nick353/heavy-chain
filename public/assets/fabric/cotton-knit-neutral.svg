  <rect x="78" y="78" width="744" height="944" rx="32" fill="url(#base)" filter="url(#shadow)"/>
  <rect x="78" y="78" width="744" height="944" rx="32" fill="url(#weave)"/>
  <path d="M100 292c160 36 294 28 434-9 99-26 183-28 266-6M105 736c171-43 333-32 483 4 82 20 155 21 232 0" fill="none" stroke="#fffaf0" stroke-opacity=".2" stroke-width="12"/>
